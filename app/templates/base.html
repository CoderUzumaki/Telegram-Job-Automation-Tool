<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Job Radar{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">Job Radar</div>
    <nav class="nav">
      <a href="/" class="nav-link {% if page == 'inbox' %}active{% endif %}">Inbox{% if inbox_count is defined %} ({{ inbox_count }}){% endif %}</a>
      <a href="/approved" class="nav-link {% if page == 'approved' %}active{% endif %}">Approved{% if approved_count is defined %} ({{ approved_count }}){% endif %}</a>
      <a href="/settings" class="nav-link {% if page == 'settings' %}active{% endif %}">Settings</a>
    </nav>
    <div class="status">
      <span class="dot connected"></span>
      <span class="status-text">Local</span>
    </div>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
