{% for message in messages %}
<button
  class="job-item {% if selected and selected.id == message.id %}selected{% endif %}"
  hx-get="/api/messages/{{ message.id }}"
  hx-target="#detail-panel"
  hx-swap="innerHTML"
>
  <div class="job-item-top">
    <span class="company">{{ message.extraction.company.value or "Unknown" }}</span>
    {% if message.relevance_score is not none %}
    <span class="score-badge score-{{ 'high' if message.relevance_score >= 80 else ('mid' if message.relevance_score >= 50 else 'low') }}">
      {{ message.relevance_score }}
    </span>
    {% endif %}
  </div>
  <div class="job-item-sub">
  {{ message.extraction.role.value or "Role unknown" }}
  </div>
  <div class="job-item-meta">
    {{ message.links|length }} links
    {% if not message.parser_matched %} · unparsed{% endif %}
    {% if message.job_index > 0 %} · #{{ message.job_index + 1 }}{% endif %}
  </div>
</button>
{% else %}
<div class="empty-state">No Post for Now.</div>
{% endfor %}
